<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="wrap">
    <h1>Sign up</h1>

    <form class="auth" th:action="@{/register}" th:object="${form}" method="post" novalidate>

        <label for="name">First name</label>
        <input type="text" th:field="*{name}" autocomplete="given-name">
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>

        <label for="surname">Last name</label>
        <input type="text" th:field="*{surname}" autocomplete="family-name">
        <p class="field-error" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}">Error</p>

        <label for="email">Email</label>
        <input type="email" th:field="*{email}" autocomplete="email">
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>

        <label for="password">Password</label>
        <input type="password" th:field="*{password}" autocomplete="new-password">
        <p class="hint">At least 8 characters</p>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>

        <label for="confirmPassword">Repeat password</label>
        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
        <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Error</p>

        <button type="submit" class="btn">Create account</button>
    </form>

    <p class="muted">Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>

</body>
</html>
