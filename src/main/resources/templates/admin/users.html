<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>
<nav th:replace="~{fragments :: adminNav('users')}"></nav>

<main class="wrap">
    <h1>Users <span class="muted" th:text="'(' + ${usersPage.totalElements} + ')'">(0)</span></h1>

    <p class="flash" th:if="${message}" th:text="${message}">Done</p>
    <p class="flash err" th:if="${error}" th:text="${error}">Error</p>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Roles</th><th>Registered</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usersPage.content}">
                <td th:text="${u.userId}">1</td>
                <td th:text="${u.name + ' ' + u.surname}">First Last</td>
                <td th:text="${u.email}">mail@example.com</td>
                <td>
                    <span class="badge" th:each="r : ${u.roles}"
                          th:classappend="${r.name.name() == 'ADMIN'} ? 'admin'"
                          th:text="${r.name}">USER</span>
                </td>
                <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                <td>
                    <form class="inline" th:if="${!u.admin}" method="post"
                          th:action="@{/admin/users/{id}/make-admin(id=${u.userId})}"
                        <input type="hidden" name="page" th:value="${usersPage.number}">
                        <button type="submit" class="btn-small">Make admin</button>
                    </form>

                    <form class="inline" th:if="${u.admin and !#strings.equalsIgnoreCase(u.email, currentEmail)}" method="post"
                          th:action="@{/admin/users/{id}/remove-admin(id=${u.userId})}"
                        <input type="hidden" name="page" th:value="${usersPage.number}">
                        <button type="submit" class="btn-small"
                                onclick="return confirm('Remove admin rights?')">Remove admin</button>
                    </form>

                    <span class="muted" th:if="${u.admin and #strings.equalsIgnoreCase(u.email, currentEmail)}">this is you</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pager" th:if="${usersPage.totalPages > 1}">
        <a th:if="${usersPage.hasPrevious()}" th:href="@{/admin/users(page=${usersPage.number - 1})}">Previous</a>
        <span>Page <span th:text="${usersPage.number + 1}">1</span>
              of <span th:text="${usersPage.totalPages}">1</span></span>
        <a th:if="${usersPage.hasNext()}" th:href="@{/admin/users(page=${usersPage.number + 1})}">Next</a>
    </nav>
</main>

</body>
</html>
