<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пользователи — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>
<nav th:replace="~{fragments :: adminNav('users')}"></nav>

<main class="wrap">
    <h1>Пользователи <span class="muted" th:text="'(' + ${usersPage.totalElements} + ')'">(0)</span></h1>

    <!-- Сообщения после действий (flash-атрибуты из контроллера) -->
    <p class="flash" th:if="${message}" th:text="${message}">Готово</p>
    <p class="flash err" th:if="${error}" th:text="${error}">Ошибка</p>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>ID</th><th>Имя</th><th>Email</th><th>Роли</th><th>Зарегистрирован</th><th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usersPage.content}">
                <td th:text="${u.userId}">1</td>
                <td th:text="${u.name + ' ' + u.surname}">Имя Фамилия</td>
                <td th:text="${u.email}">mail@example.com</td>
                <td>
                    <span class="badge" th:each="r : ${u.roles}"
                          th:classappend="${r.name.name() == 'ADMIN'} ? 'admin'"
                          th:text="${r.name}">USER</span>
                </td>
                <td th:text="${#temporals.format(u.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
                <td>
                    <!-- Не админ: можно сделать админом -->
                    <form class="inline" th:if="${!u.admin}" method="post"
                          th:action="@{/admin/users/{id}/make-admin(id=${u.userId})}">
                        <input type="hidden" name="page" th:value="${usersPage.number}">
                        <button type="submit" class="btn-small">Сделать админом</button>
                    </form>

                    <!-- Админ, но не вы: можно снять права -->
                    <form class="inline" th:if="${u.admin and !#strings.equalsIgnoreCase(u.email, currentEmail)}" method="post"
                          th:action="@{/admin/users/{id}/remove-admin(id=${u.userId})}">
                        <input type="hidden" name="page" th:value="${usersPage.number}">
                        <button type="submit" class="btn-small"
                                onclick="return confirm('Снять права администратора?')">Снять права</button>
                    </form>

                    <!-- Это вы -->
                    <span class="muted" th:if="${u.admin and #strings.equalsIgnoreCase(u.email, currentEmail)}">это вы</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Переключение страниц -->
    <nav class="pager" th:if="${usersPage.totalPages > 1}">
        <a th:if="${usersPage.hasPrevious()}" th:href="@{/admin/users(page=${usersPage.number - 1})}">Назад</a>
        <span>Страница <span th:text="${usersPage.number + 1}">1</span>
              из <span th:text="${usersPage.totalPages}">1</span></span>
        <a th:if="${usersPage.hasNext()}" th:href="@{/admin/users(page=${usersPage.number + 1})}">Вперёд</a>
    </nav>
</main>

</body>
</html>
