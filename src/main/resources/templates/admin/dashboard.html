<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>
<nav th:replace="~{fragments :: adminNav('dashboard')}"></nav>

<main class="wrap">
    <h1>Admin panel</h1>

    <ul class="stats">
        <li><span class="num" th:text="${stats.users}">0</span><span class="lbl">Users</span></li>
        <li><span class="num" th:text="${stats.usersPerWeek}">0</span><span class="lbl">New in 7 days</span></li>
        <li><span class="num" th:text="${stats.admins}">0</span><span class="lbl">Admins</span></li>
        <li><span class="num" th:text="${stats.books}">0</span><span class="lbl">Books in catalog</span></li>
    </ul>

    <h2>Latest registrations</h2>
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr><th>Name</th><th>Email</th><th>Registered</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${latest}">
                <td th:text="${u.name + ' ' + u.surname}">First Last</td>
                <td th:text="${u.email}">mail@example.com</td>
                <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
            </tr>
            </tbody>
        </table>
    </div>

    <p><a th:href="@{/admin/users}">All users</a></p>
</main>

</body>
</html>
