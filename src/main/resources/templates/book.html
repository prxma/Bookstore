<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${book.title} + ' — Bookstore'">Book</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="wrap">
    <a class="back" th:href="@{/books}">All books</a>

    <p class="flash" th:if="${message}" th:text="${message}">Done</p>
    <p class="flash err" th:if="${error}" th:text="${error}">Error</p>

    <div class="detail">

        <div class="cover" th:style="'--h:' + ${(book.id * 47) % 360}" aria-hidden="true">
            <span class="ca" th:text="${book.author}">Author</span>
            <span class="ct" th:text="${book.title}">Title</span>
        </div>

        <div>
            <h1 th:text="${book.title}">Book title</h1>
            <p class="byline" th:text="${book.author}">Author</p>

            <ul class="tags" th:if="${book.genres != null and !book.genres.isEmpty()}">
                <li class="tag" th:each="g : ${book.genres}" th:text="${g.name}">Genre</li>
            </ul>

            <div class="buy">
                <p class="price"><span th:text="${#numbers.formatDecimal(book.price, 1, 'COMMA', 2, 'POINT')}">0.00</span> BYN</p>

                <form th:if="${currentEmail != null}" th:action="@{/books/{id}/buy(id=${book.id})}" method="post">
                    <button type="submit" class="btn">Buy</button>
                </form>

                <a th:if="${currentEmail == null}" class="btn" th:href="@{/login}">Log in to buy</a>
            </div>

            <dl class="facts">
                <th:block th:if="${book.year_of_publishing != null}">
                    <dt>Year</dt>
                    <dd th:text="${book.year_of_publishing}">1949</dd>
                </th:block>

                <th:block th:if="${book.pages != null}">
                    <dt>Pages</dt>
                    <dd th:text="${book.pages}">320</dd>
                </th:block>

                <th:block th:if="${book.isbn != null}">
                    <dt>ISBN</dt>
                    <dd th:text="${book.isbn}">978-0-00-000000-0</dd>
                </th:block>

                <th:block th:if="${book.coverSet != null and !book.coverSet.isEmpty()}">
                    <dt>Cover</dt>
                    <dd>
                        <ul class="tags">
                            <li class="tag" th:each="c : ${book.coverSet}" th:switch="${c.name?.name()}">
                                <span th:case="'HARD'">Hardcover</span>
                                <span th:case="'SOFT'">Softcover</span>
                                <span th:case="'SPECIAL'">Collector edition</span>
                                <span th:case="*" th:text="${c.name}">Other</span>
                            </li>
                        </ul>
                    </dd>
                </th:block>
            </dl>

            <section class="about" th:if="${book.description != null and !book.description.isBlank()}">
                <h2>About the book</h2>
                <p th:text="${book.description}">Book description.</p>
            </section>
        </div>
    </div>

    <section class="similar" th:if="${similar != null and !similar.isEmpty()}">
        <h2>Similar books</h2>
        <ul class="shelf">
            <li class="item" th:each="b, st : ${similar}" th:style="'--i:' + ${st.index}">
                <a class="cover" th:href="@{/books/{id}(id=${b.id})}"
                   th:style="'--h:' + ${(b.id * 47) % 360}" tabindex="-1" aria-hidden="true">
                    <span class="ca" th:text="${b.author}">Author</span>
                    <span class="ct" th:text="${b.title}">Title</span>
                </a>
                <div class="meta">
                    <h2><a th:href="@{/books/{id}(id=${b.id})}" th:text="${b.title}">Title</a></h2>
                    <p class="author" th:text="${b.author}">Author</p>
                    <p class="price"><span th:text="${#numbers.formatDecimal(b.price, 1, 'COMMA', 2, 'POINT')}">0.00</span> BYN</p>
                </div>
            </li>
        </ul>
    </section>
</main>

</body>
</html>
