<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="wrap">
    <h1>Log in</h1>

    <p class="form-ok" th:if="${param.registered}">Registration successful. Please log in.</p>

    <p class="form-error" th:if="${param.error}">Wrong email or password.</p>

    <form class="auth" th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input id="username" type="email" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn">Log in</button>
    </form>

    <p class="muted">No account yet? <a th:href="@{/register}">Sign up</a></p>
</main>

</body>
</html>
