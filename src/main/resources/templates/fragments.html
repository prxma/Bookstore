<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="top" th:fragment="header">
    <div class="in">
        <a class="brand" th:href="@{/books}">Bookstore</a>
        <div class="who">
            <a th:if="${isAdmin}" th:href="@{/admin}">Админка</a>

            <th:block th:if="${currentEmail != null}">
                <a th:href="@{/purchases}">Мои покупки</a>
                <span th:text="${currentEmail}">user@mail</span>
                <form class="inline" th:action="@{/logout}" method="post">
                    <button type="submit" class="link">Выйти</button>
                </form>
            </th:block>

            <th:block th:if="${currentEmail == null}">
                <a th:href="@{/login}">Войти</a>
                <a th:href="@{/register}">Регистрация</a>
            </th:block>
        </div>
    </div>
</header>

<nav class="adminnav" th:fragment="adminNav(active)">
    <div class="in">
        <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'on'">Сводка</a>
        <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'on'">Пользователи</a>
        <a th:href="@{/admin/purchases}" th:classappend="${active == 'purchases'} ? 'on'">Покупки</a>
        <a th:href="@{/admin/stats}" th:classappend="${active == 'stats'} ? 'on'">Статистика</a>
    </div>
</nav>

</body>
</html>
