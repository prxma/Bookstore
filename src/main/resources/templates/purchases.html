<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои покупки — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="wrap">
    <h1>Мои покупки</h1>

    <p class="flash" th:if="${message}" th:text="${message}">Готово</p>
    <p class="flash err" th:if="${error}" th:text="${error}">Ошибка</p>

    <p class="empty" th:if="${#lists.isEmpty(purchases)}">
        Покупок пока нет. <a th:href="@{/books}">Перейти в каталог</a>
    </p>

    <div class="table-wrap" th:unless="${#lists.isEmpty(purchases)}">
        <table class="table">
            <thead>
            <tr><th>Дата</th><th>Книга</th><th>Автор</th><th>Цена</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${purchases}">
                <td th:text="${#temporals.format(p.purchasedAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</td>
                <td><a th:href="@{/books/{id}(id=${p.book.id})}" th:text="${p.book.title}">Название</a></td>
                <td th:text="${p.book.author}">Автор</td>
                <td><span th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</span> BYN</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3">Итого</th>
                <th><span th:text="${#numbers.formatDecimal(total, 1, 2)}">0.00</span> BYN</th>
            </tr>
            </tfoot>
        </table>
    </div>
</main>

</body>
</html>
