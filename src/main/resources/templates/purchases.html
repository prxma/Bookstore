<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My purchases — Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="wrap">
    <h1>My purchases</h1>

    <p class="flash" th:if="${message}" th:text="${message}">Done</p>
    <p class="flash err" th:if="${error}" th:text="${error}">Error</p>

    <p class="empty" th:if="${#lists.isEmpty(purchases)}">
        No purchases yet. <a th:href="@{/books}">Go to the catalog</a>
    </p>

    <div class="table-wrap" th:unless="${#lists.isEmpty(purchases)}">
        <table class="table">
            <thead>
            <tr><th>Date</th><th>Book</th><th>Author</th><th>Price</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${purchases}">
                <td th:text="${#temporals.format(p.purchasedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                <td><a th:href="@{/books/{id}(id=${p.book.id})}" th:text="${p.book.title}">Title</a></td>
                <td th:text="${p.book.author}">Author</td>
                <td><span th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">0.00</span> BYN</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3">Total</th>
                <th><span th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">0.00</span> BYN</th>
            </tr>
            </tfoot>
        </table>
    </div>
</main>

</body>
</html>
